# Corvex-RedOps + MobSF, co-located. The Corvex-RedOps server orchestrates MobSF, which
# performs the actual APK/IPA analysis. Users upload apps through the console —
# no file paths, no direct MobSF access needed.
#
#   1. export MOBSF_API_KEY=$(openssl rand -hex 32)
#   2. export PENTESTIQ_SECRET_KEY=$(openssl rand -hex 32)
#   3. docker compose -f deploy/docker-compose.yml up -d --build
#   4. open http://localhost:8080  (console) — sign in as the first-run admin (one-time password,
#      printed once to the log), then Upload & scan an APK. Self-service registration is OFF
#      unless CORVEX_ALLOW_REGISTRATION=1; add workspaces with `corvex init-tenant`.
#
# Network exposure: the mobile-analysis service and the local AI runtime are published on
# 127.0.0.1 only. The console listens on PENTESTIQ_LISTEN (default 0.0.0.0, every interface)
# over plain HTTP — put TLS in front of it, or set PENTESTIQ_LISTEN=127.0.0.1.
services:
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: pentestiq-mobsf
    environment:
      - MOBSF_API_KEY=${MOBSF_API_KEY:?set MOBSF_API_KEY}
    ports:
      - "127.0.0.1:8000:8000"   # mobile-analysis UI/API: this host only (the console reaches it as http://mobsf:8000)
    restart: unless-stopped

  pentestiq:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pentestiq-api
    depends_on:
      - mobsf
    environment:
      - MOBSF_URL=http://mobsf:8000
      - MOBSF_API_KEY=${MOBSF_API_KEY:?set MOBSF_API_KEY}
      - PENTESTIQ_SECRET_KEY=${PENTESTIQ_SECRET_KEY:?set PENTESTIQ_SECRET_KEY}
      - PENTESTIQ_AI=${PENTESTIQ_AI:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - PENTESTIQ_AI_MODEL=${PENTESTIQ_AI_MODEL:-qwen2.5:7b-instruct}
      - CORVEX_ADMIN_USER=${CORVEX_ADMIN_USER:-admin}
      - CORVEX_ADMIN_PASSWORD=${CORVEX_ADMIN_PASSWORD:-}
    ports:
      - "${PENTESTIQ_LISTEN:-0.0.0.0}:${PENTESTIQ_PORT:-8080}:8080"   # Corvex-RedOps API + console (install.sh --listen)
    volumes:
      - pentestiq-data:/app/data
    restart: unless-stopped

  # Optional local LLM for the AI layer. Start with:  docker compose --profile ai up -d
  # then pull a model:  docker exec -it pentestiq-ollama ollama pull qwen2.5:7b-instruct
  # and set PENTESTIQ_AI=1 in deploy/.env. Everything works without it.
  ollama:
    image: ollama/ollama:latest
    container_name: pentestiq-ollama
    profiles: ["ai"]
    ports:
      - "127.0.0.1:11434:11434"   # local AI runtime: this host only (the console reaches it as http://ollama:11434)
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  pentestiq-data:
  ollama-models:
