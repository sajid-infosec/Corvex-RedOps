[project]
name = "pentestiq"
version = "0.1.0.dev0"
description = "Orchestration-driven Vulnerability Assessment & Penetration Testing platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary (see LICENSE)" }
authors = [{ name = "Sajid" }]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pentestiq = "pentestiq.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pentestiq*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
