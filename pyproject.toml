[project]
name = "pentestiq"
version = "0.1.0"
description = "Orchestration-driven Vulnerability Assessment & Penetration Testing platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sajid" }]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "reportlab>=4.0", "python-docx>=1.1", "python-multipart>=0.0.9"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
reports = ["reportlab>=4.0", "python-docx>=1.1"]

[project.scripts]
pentestiq = "pentestiq.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pentestiq*"]

[tool.setuptools.package-data]
"pentestiq" = ["api/static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
