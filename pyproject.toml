[project]
name = "pentestiq"
version = "0.1.0"
description = "Orchestration-driven Vulnerability Assessment & Penetration Testing platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sajid" }]
keywords = ["security", "vapt", "dast", "owasp", "pentest", "vulnerability-scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42.0",   # credential-vault encryption at rest
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "reportlab>=4.0", "python-docx>=1.1", "python-multipart>=0.0.9", "lief>=0.14"]
authscan = ["paramiko>=3.4", "pywinrm>=0.4"]   # credentialed SSH / WinRM scanning
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
reports = ["reportlab>=4.0", "python-docx>=1.1"]
desktop = ["lief>=0.14"]
spa = ["playwright>=1.40"]
ai = ["scikit-learn>=1.3"]   # self-learning confidence model; local Ollama needs no pip dep
all = [
    "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9",
    "reportlab>=4.0", "python-docx>=1.1", "lief>=0.14", "playwright>=1.40", "scikit-learn>=1.3",
]

[project.scripts]
pentestiq = "pentestiq.cli:app"

[project.urls]
Homepage = "https://github.com/sajid-infosec/PentestIQ"
Repository = "https://github.com/sajid-infosec/PentestIQ"
Issues = "https://github.com/sajid-infosec/PentestIQ/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pentestiq*"]

[tool.setuptools.package-data]
"pentestiq" = ["api/static/*", "kit/frida/*", "intel/data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
